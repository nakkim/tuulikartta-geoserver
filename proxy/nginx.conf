# Public entry point. Only read-only map services are exposed; the admin UI,
# REST API and all other OGC services stay reachable only on the host
# (GeoServer port is bound to GEOSERVER_BIND_ADDRESS).
# TLS is expected to terminate in front of this proxy (load balancer / ingress).

server_tokens off;

# When another reverse proxy runs in front of this one (e.g. host nginx behind
# a load balancer), its requests arrive from a private address: the Docker
# network gateway via docker-proxy, or a private network. Take the client IP
# from X-Forwarded-For only for those, so per-IP throttling sees real clients.
# Public clients reach the container with their own source IP and cannot set it.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;

    client_max_body_size 1k;

    proxy_set_header Host $http_host;
    # Overwrite, not append: GeoServer control-flow throttles per X-Forwarded-For,
    # so clients must not be able to spoof it. $remote_addr is the real client
    # IP after the set_real_ip_from handling above.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 70s;

    location ~ ^/geoserver/(radar/)?wms$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://geoserver:8080;
    }

    location ~ ^/geoserver/gwc/service/wmts$ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://geoserver:8080;
    }

    location / {
        return 404;
    }
}
