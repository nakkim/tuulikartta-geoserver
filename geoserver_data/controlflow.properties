# GeoServer control-flow: https://docs.geoserver.org/stable/en/user/extensions/controlflow/index.html
# Clients are identified by X-Forwarded-For, which the nginx proxy sets.

# Seconds a request may wait in queue before failing
timeout=60
# Concurrent OWS requests in total
ows.global=100
# Concurrent WMS GetMap requests in total
ows.wms.getmap=10
# Concurrent GeoWebCache (WMTS / tiled) requests in total
ows.gwc=16
# Concurrent requests per client IP
ip=10
# GetMap rate per client IP; above it, wait 2 s, then reject
ip.ows.wms.getmap=30/s;2s
