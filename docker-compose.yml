services:
  radar-poller:
    image: ghcr.io/nakkim/tuulikartta-geoserver/radar-poller:latest
    build: ./radar_poller
    restart: unless-stopped
    environment:
      - POLL_INTERVAL_SECONDS=10
      - OUTPUT_DIR=/data/dbz/geotiff
      - RETENTION_HOURS=1
      - GEOSERVER_HARVEST_ENABLED=true
      - GEOSERVER_URL=http://geoserver:8080/geoserver
      - GEOSERVER_WORKSPACE=radar
      - GEOSERVER_STORE=finland_dbz_eureffin
      - GEOSERVER_COVERAGE=radar_finland_eureffin
      - MOSAIC_NAME=finland_dbz_eureffin
      - GEOSERVER_USER=${GEOSERVER_ADMIN_USER:?Set GEOSERVER_ADMIN_USER in .env}
      - GEOSERVER_PASSWORD=${GEOSERVER_ADMIN_PASSWORD:?Set GEOSERVER_ADMIN_PASSWORD in .env}
      - POSTGIS_HOST=postgis
      - POSTGIS_PORT=5432
      - POSTGIS_DB=${POSTGIS_DB:?Set POSTGIS_DB in .env}
      - POSTGIS_USER=${POSTGIS_USER:?Set POSTGIS_USER in .env}
      - POSTGIS_PASSWORD=${POSTGIS_PASSWORD:?Set POSTGIS_PASSWORD in .env}
    volumes:
      - ./data/dbz/geotiff:/data/dbz/geotiff

  postgis:
    # Multi-arch build of postgis/postgis (official image has no arm64)
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGIS_DB:?Set POSTGIS_DB in .env}
      - POSTGRES_USER=${POSTGIS_USER:?Set POSTGIS_USER in .env}
      - POSTGRES_PASSWORD=${POSTGIS_PASSWORD:?Set POSTGIS_PASSWORD in .env}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  geoserver:
    image: kartoza/geoserver:2.28.3
    restart: unless-stopped
    environment:
      - GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER:?Set GEOSERVER_ADMIN_USER in .env}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD:?Set GEOSERVER_ADMIN_PASSWORD in .env}
      # Web admin UI (/geoserver/web). Off unless explicitly enabled; REST API stays available.
      - DISABLE_WEB_INTERFACE=${GEOSERVER_DISABLE_WEB_INTERFACE:?Set GEOSERVER_DISABLE_WEB_INTERFACE in .env}
    ports:
      # Admin access (web UI, REST). Use 127.0.0.1 in production and reach it via SSH tunnel.
      - "${GEOSERVER_BIND_ADDRESS:?Set GEOSERVER_BIND_ADDRESS in .env}:8080:8080"
    volumes:
      - ./geoserver_data:/opt/geoserver/data_dir
      - ./data/dbz/geotiff:/data/dbz/geotiff
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u \"$${GEOSERVER_ADMIN_USER}:$${GEOSERVER_ADMIN_PASSWORD}\" http://localhost:8080/geoserver/rest/about/version.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:?Set PROXY_PORT in .env}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      geoserver:
        condition: service_healthy

  geoserver-init:
    image: ghcr.io/nakkim/tuulikartta-geoserver/geoserver-init:latest
    build: ./geoserver_init
    environment:
      - GEOSERVER_URL=http://geoserver:8080/geoserver
      - GEOSERVER_USER=${GEOSERVER_ADMIN_USER:?Set GEOSERVER_ADMIN_USER in .env}
      - GEOSERVER_PASSWORD=${GEOSERVER_ADMIN_PASSWORD:?Set GEOSERVER_ADMIN_PASSWORD in .env}
      - GEOSERVER_WORKSPACE=radar
      - GEOSERVER_STORE=finland_dbz_eureffin
      - GEOSERVER_COVERAGE=radar_finland_eureffin
      - MOSAIC_NAME=finland_dbz_eureffin
      - MOSAIC_DIR=/data/dbz/geotiff
    volumes:
      - ./data/dbz/geotiff:/data/dbz/geotiff:ro
    depends_on:
      geoserver:
        condition: service_healthy
    restart: "no"

volumes:
  postgis_data:
